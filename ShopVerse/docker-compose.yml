# Ch13-04: Full docker-compose — all services ShopVerse depends on
services:

  # ─── Application ──────────────────────────────────────────────────────────
  shopverse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopverse-app
    ports:
      - "8080:8080"
    environment:
      DB_USER: shopverse
      DB_PASS: shopverse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017/shopverse
      CASSANDRA_HOST: cassandra
      ES_URI: http://elasticsearch:9200
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: shopverse-dev-secret-minimum-32-characters
    depends_on:
      postgres:   { condition: service_healthy }
      redis:      { condition: service_healthy }
      kafka:      { condition: service_started }
      mongo:      { condition: service_started }
    networks: [shopverse-net]
    restart: unless-stopped

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopverse-postgres
    environment:
      POSTGRES_DB: shopverse
      POSTGRES_USER: shopverse
      POSTGRES_PASSWORD: shopverse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopverse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [shopverse-net]

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shopverse-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [shopverse-net]

  # ─── MongoDB ──────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: shopverse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks: [shopverse-net]

  # ─── Cassandra ────────────────────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: shopverse-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ShopVerseCluster
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks: [shopverse-net]

  # ─── Elasticsearch ────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: shopverse-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [shopverse-net]

  # ─── Zookeeper + Kafka ────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: shopverse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [shopverse-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: shopverse-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [shopverse-net]

  # ─── Neo4j ────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: shopverse-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/shopverse
    volumes:
      - neo4j-data:/data
    networks: [shopverse-net]

  # ─── Nginx reverse proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shopverse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [shopverse-app]
    networks: [shopverse-net]

  # ─── Prometheus + Grafana ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: shopverse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [shopverse-net]

  grafana:
    image: grafana/grafana:latest
    container_name: shopverse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [shopverse-net]

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  cassandra-data:
  es-data:
  neo4j-data:
  grafana-data:

networks:
  shopverse-net:
    driver: bridge
