AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ShopFlow Secrets Manager — Module 4: Application Secrets
  Stores all sensitive credentials encrypted at rest.
  Deploy BEFORE RDS so the DB password is ready to reference.
  Deploy BEFORE ECS so containers can fetch secrets at startup.

Parameters:
  ProjectName:
    Type: String
    Default: shopflow
    Description: Project name prefix for all secret paths

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, production]

# ─────────────────────────────────────────────────────────────
# CONCEPT: AWS Secrets Manager
#
# Secrets Manager stores sensitive values (passwords, API keys,
# tokens) encrypted using KMS. Applications retrieve secrets
# using an IAM role — the secret value never appears in code,
# config files, or environment variables in plain text.
#
# Key concepts:
#
#  1. SECRET PATH (Name): secrets are organised like file paths.
#     ShopFlow uses: /<ProjectName>/<category>/<key>
#     Example: /shopflow/db/master, /shopflow/app/jwt-secret
#     This matches the SSM path prefix in IAM policies already created.
#
#  2. SECRET VALUE: stored as a JSON string. For database credentials,
#     the value is {"username":"shopverse","password":"<auto-generated>"}.
#     RDS can read this format natively when you use the secret ARN
#     in the DB instance definition — it creates the user automatically.
#
#  3. AUTO-ROTATION: Secrets Manager can rotate the DB password on a
#     schedule (e.g., every 30 days). It updates both the secret value
#     AND the actual DB password atomically — your running app keeps
#     working because it fetches the secret fresh on each DB connection.
#     (Rotation is configured here but uses a Lambda rotation function
#     — we will wire it to RDS in the RDS module.)
#
#  4. HOW APPS READ SECRETS:
#     - ECS: reference the secret ARN in the task definition under
#       "secrets" — ECS injects it as an environment variable at task start.
#     - EC2: call the Secrets Manager API using the AWS SDK in your
#       startup script (user data) or app startup code.
#     - Lambda: same SDK call, or ECS-style injection via function config.
#
#  5. COST: $0.40 per secret per month + $0.05 per 10,000 API calls.
#     5 secrets here = $2/month. Negligible.
#
#  6. vs SSM Parameter Store:
#     - Secrets Manager: for passwords and tokens that must be rotated.
#     - SSM Parameter Store (free): for non-sensitive config like endpoints,
#       feature flags, environment names.
# ─────────────────────────────────────────────────────────────

Resources:

  # ── SECRET 1: RDS Database Master Credentials ──────────────────────────────
  # Stores the master username and password for the RDS MySQL instance.
  #
  # IMPORTANT: We do NOT hardcode the password in this template.
  # Secrets Manager generates a random password automatically using the
  # GenerateSecretString block. The generated value looks like:
  #   {"username": "shopverse_admin", "password": "Xk9#mPq2..."}
  #
  # The RDS stack will reference this secret's ARN in the
  # MasterUserPassword field — RDS reads the password from the secret
  # without it ever appearing in CloudFormation or the AWS Console.
  DBMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectName}/db/master"
      Description: "RDS MySQL master credentials for ShopFlow. DO NOT manually edit the password field — use Secrets Manager rotation."
      # GenerateSecretString: Secrets Manager creates a random password.
      # This is more secure than typing a password and far better than
      # committing a password to a CloudFormation template in git.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${ProjectName}_admin"}'
        GenerateStringKey: "password"
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'   # Exclude chars that break MySQL connection strings
        ExcludePunctuation: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: RotationEnabled
          Value: "true"  # Reminder tag — actual rotation wired in RDS module

  # ── SECRET 2: Application Database Password (App User) ─────────────────────
  # Separate from the master credentials.
  # Best practice: the Spring Boot app connects as a limited-privilege
  # application user (SELECT/INSERT/UPDATE/DELETE only), NOT as the master user.
  # The master user is only for DB admin tasks (schema migrations via Flyway).
  #
  # This secret will be created here; the actual MySQL user is created
  # by Flyway migrations when the app first starts.
  DBAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectName}/db/app"
      Description: "MySQL application user credentials for ShopFlow Spring Boot app. Limited privileges (no DROP/ALTER)."
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${ProjectName}_app", "dbname": "shopverse"}'
        GenerateStringKey: "password"
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  # ── SECRET 3: JWT Signing Secret ───────────────────────────────────────────
  # Used by JwtTokenProvider to sign and verify JWT access tokens.
  # ShopVerse uses HS512 — requires a key of at least 64 bytes.
  # We generate 64 random URL-safe characters (alphanumeric only to avoid
  # Spring Boot YAML parsing issues).
  #
  # The ECS task definition will inject this as the JWT_SECRET env var.
  # Spring Boot reads it via: @Value("${JWT_SECRET}")
  JWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectName}/app/jwt-secret"
      Description: "HS512 JWT signing key for ShopFlow. 64+ character random string. Rotate manually — rotating this invalidates all existing JWTs (all users are logged out)."
      GenerateSecretString:
        # For JWT we want a single string, not a JSON object.
        # We use GenerateStringKey with a simple wrapper.
        SecretStringTemplate: '{}'
        GenerateStringKey: "jwt_secret"
        PasswordLength: 64
        # Only alphanumeric — no special chars. Spring Boot @Value can have
        # issues with special characters in YAML if the value isn't quoted.
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: RotationNote
          Value: "Rotating this secret logs out ALL users. Coordinate with the team."

  # ── SECRET 4: Redis Authentication Token ───────────────────────────────────
  # ElastiCache Redis can require an AUTH token (password) for all connections.
  # Constraints: 16-128 characters, alphanumeric only (ElastiCache requirement).
  # The Spring Boot app passes this via:
  #   spring.data.redis.password = ${REDIS_AUTH_TOKEN}
  RedisAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectName}/app/redis-auth"
      Description: "ElastiCache Redis AUTH token for ShopFlow. 16-128 alphanumeric characters."
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "auth_token"
        PasswordLength: 32
        ExcludePunctuation: true  # ElastiCache only accepts alphanumeric auth tokens
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  # ── SECRET 5: Third-Party API Keys ─────────────────────────────────────────
  # Placeholder for external service credentials (Stripe, SendGrid, etc.).
  # We create the secret now with a placeholder value and update it manually
  # after provisioning accounts with those services.
  # You NEVER commit real API keys to git or CloudFormation templates.
  ThirdPartySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectName}/app/third-party"
      Description: "Third-party API keys for ShopFlow (Stripe, SendGrid). UPDATE MANUALLY with real keys after deployment."
      # For this secret we provide a placeholder JSON — update via console or CLI.
      SecretString: !Sub |
        {
          "stripe_secret_key": "sk_test_REPLACE_WITH_REAL_KEY",
          "stripe_webhook_secret": "whsec_REPLACE_WITH_REAL_KEY",
          "sendgrid_api_key": "SG.REPLACE_WITH_REAL_KEY"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: ActionRequired
          Value: "UPDATE with real API keys before first deploy"

# ─────────────────────────────────────────────────────────────
# OUTPUTS
# Export secret ARNs so the RDS and ECS stacks can reference them
# without hardcoding ARN values (which change per account/region).
# ─────────────────────────────────────────────────────────────
Outputs:

  DBMasterSecretArn:
    Description: ARN of the RDS master credentials secret
    Value: !Ref DBMasterSecret
    Export:
      Name: !Sub "${ProjectName}-db-master-secret-arn"

  DBMasterSecretName:
    Description: Name/path of the RDS master credentials secret
    Value: !Sub "/${ProjectName}/db/master"
    Export:
      Name: !Sub "${ProjectName}-db-master-secret-name"

  DBAppSecretArn:
    Description: ARN of the application DB user credentials secret
    Value: !Ref DBAppSecret
    Export:
      Name: !Sub "${ProjectName}-db-app-secret-arn"

  JWTSecretArn:
    Description: ARN of the JWT signing key secret
    Value: !Ref JWTSecret
    Export:
      Name: !Sub "${ProjectName}-jwt-secret-arn"

  RedisAuthSecretArn:
    Description: ARN of the Redis AUTH token secret
    Value: !Ref RedisAuthSecret
    Export:
      Name: !Sub "${ProjectName}-redis-auth-secret-arn"

  ThirdPartySecretArn:
    Description: ARN of the third-party API keys secret (update manually after deploy)
    Value: !Ref ThirdPartySecret
    Export:
      Name: !Sub "${ProjectName}-third-party-secret-arn"
