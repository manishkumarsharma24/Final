AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ShopFlow IAM - Step 5: Account Password Policy
  Sets the AWS account-level password policy.
  Deploy this FIRST (even before policies) - applies to entire account.
  NOTE: Only one password policy per AWS account.

Resources:

  AccountPasswordPolicy:
    Type: AWS::IAM::AccountPasswordPolicy
    Properties:
      # Minimum password length
      MinimumPasswordLength: 12

      # Complexity requirements
      RequireUppercaseCharacters: true
      RequireLowercaseCharacters: true
      RequireNumbers: true
      RequireSymbols: true

      # Expiry - users must change every 90 days
      MaxPasswordAge: 90

      # Prevent reuse of last 5 passwords
      PasswordReusePrevention: 5

      # Allow users to change their own password
      AllowUsersToChangePassword: true

      # Do NOT expire admin passwords automatically
      # (admins manage their own rotation)
      HardExpiry: false
